<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: #1a1a1a; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .logo {
            font-size: 80px; font-weight: 900; letter-spacing: -4px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            user-select: none;
        }
        .search-container {
            width: 100%; max-width: 600px; display: flex;
            background: #2a2a2a; border-radius: 30px;
            padding: 5px 20px; border: 1px solid #444;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-container:focus-within {
            border-color: #3a7bd5;
            box-shadow: 0 0 15px rgba(58, 123, 213, 0.3);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 18px; padding: 12px 0;
        }
        .search-input::placeholder { color: #888; }
        .search-btn {
            background: transparent; border: none; color: #3a7bd5;
            font-size: 20px; cursor: pointer; padding: 0 10px;
        }
        .search-btn:hover { color: #00d2ff; }
    </style>
</head>
<body>
    <div class="logo">Yo</div>
    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Търсете в мрежата..." autofocus>
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>
    <script>
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            }
        }
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
